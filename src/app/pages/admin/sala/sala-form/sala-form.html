<app-container>
  <div class="form-container">
    <h2>{{ formSala.value.id ? 'Editar Sala' : 'Nova Sala' }}</h2>

   <form [formGroup]="formSala" (ngSubmit)="save()">
      <div class="form-section">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input id="nome" type="text" name="nome" class="form-control" formControlName="nome"/>
          @if (formSala.controls.nome.touched && formSala.controls.nome.invalid) {
            <small>Informe o nome.</small>
          }
        </div>

        <div class="form-group">
          <label for="preco">Preço:</label>
          <input id="preco" type="number" name="preco" class="form-control" min="0.01" step="0.01" formControlName="preco"/>
          @if (formSala.controls.preco.touched && formSala.controls.preco.invalid) {
            <small>Informe um preço válido.</small>
          }
        </div>

        <button mat-raised-button color="primary" type="submit">
          <mat-icon>save</mat-icon> Gravar
        </button>
      </div>
    </form>
  </div>
</app-container>
